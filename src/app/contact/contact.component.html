<section class="contato-wrapper">
    <div class="contato-container">
        <!-- Bloco da Esquerda -->
        <div class="contato-texto">
            <p class="subtitulo-topo">VAMOS CONVERSAR?</p>
            <h2>TEM UM DESAFIO? NÓS TEMOS A SOLUÇÃO.</h2>
            <p class="descricao">Fale com a Hï Tech e descubra como podemos transformar sua ideia em um produto digital com impacto.</p>
        </div>

        <!-- Bloco da Direita (Formulário) -->
        <form class="contato-formulario">
            <div class="campo">
                <label for="nome" class="label-nome">Nome</label>
                <input type="text" id="nome" placeholder="Seu nome" class="input-nome">
            </div>
            
            <div class="campo">
                <label for="email" class="label-email">E-mail</label>
                <input type="email" id="email" placeholder="voce@email.com" class="input-email">
            </div>

            <div class="campo">
                <label for="mensagem" class="label-mensagem">Mensagem</label>
                <textarea id="mensagem" placeholder="Conte rapidamente o que você precisa" class="input-mensagem"></textarea>
            </div>

            <button type="submit" class="btn-enviar">Enviar mensagem</button>
        </form>
    </div>
</section>
