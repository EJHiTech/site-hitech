<section class="hero-servicos">
  <div class="hero-left">
    <div class="logo-box">
      <img src="assets/hitech-logo2.png" alt="Logo Hï Tech" />
    </div>
  </div>

  <div class="hero-right">
    <span class="eyebrow">NOSSOS SERVIÇOS</span>
    <h1 class="headline">
      SOLUÇÕES<br>
      DIGITAIS<br>
      PARA TIRAR<br>
      SISTEMAS DO<br>
      PAPEL.
    </h1>
    <p class="description">
      Escolha uma frente e clique nos cards para ver como cada<br>
      serviço pode se traduzir em resultado.
    </p>
  </div>
</section>

<section class="carta-servicos">
    <p class="sub-title">CARTAS DE SERVIÇO</p>
    <h2 class="title">SERVIÇOS</h2>

    <div class="cards-container">
    <div class="card" *ngFor="let service of services" [class.flipped]="service.flipped" (click)="service.flipped = !service.flipped">
    <div class="card-inner">

        <div class="card-front">
            <span class="card-number">{{ service.number }}</span>
            <h2>{{ service.title }}</h2>
            <p>Clique para ver</p>
        </div>

        <div class="card-back">
            <p>{{ service.description }}</p>
        </div>

    </div>
    </div>
    </div>
</section>
