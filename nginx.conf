server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Prioriza o HTML pré-renderizado de cada rota (ex: /services -> /services/index.html)
        # e cai no index.html raiz (SPA) apenas se não houver versão estática.
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    error_page 404 /index.html;
}
